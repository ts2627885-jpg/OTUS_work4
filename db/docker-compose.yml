# Отдельный запуск PostgreSQL для АЗС-Пульт (self-hosted).
# Запуск: docker compose --env-file .env up -d --build   (из папки db/)
services:
  postgres:
    build: .
    image: azs-pult-postgres:18
    container_name: azs-pult-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    # По умолчанию слушает только localhost сервера. Наружу — через SSH-туннель или reverse proxy.
    ports:
      - "${DB_BIND:-127.0.0.1}:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
