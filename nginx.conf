# Nginx для АЗС-Пульт: собранный фронтенд (статика) и проксирование API на бэкенд.
# Схема: Браузер → nginx (HTTPS) → backend:3001 (контейнер backend) → PostgreSQL (Supabase или db).
#
# Перед запуском замените:
#   server_name            — ваш домен (здесь example.ru)
#   /etc/nginx/certs/      — fullchain.pem и privkey.pem (сертификат домена, например Let's Encrypt)
# Фронтенд собирается с VITE_API_URL=/api, тогда запросы идут на тот же домен.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 20m;   # загрузка CSV через /api/import/csv

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    # Ограничение частоты: общие запросы к API и отдельно вход (защита от перебора паролей)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;

    upstream backend {
        server backend:3001;
        keepalive 16;
    }

    # HTTP → HTTPS
    server {
        listen 80;
        server_name example.ru;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name example.ru;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1h;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        root /usr/share/nginx/html;
        index index.html;

        # Вход: строже ограничен по частоте
        location = /api/auth/login {
            limit_req zone=login_limit burst=5 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API (включая /api/v1/…, которые бэкенд переписывает на /api/…)
        location /api/ {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
        }

        # Хеш-имена файлов сборки можно кэшировать надолго
        location /assets/ {
            add_header Cache-Control "public, max-age=2592000, immutable";
            try_files $uri =404;
        }

        # Одностраничное приложение: любой другой путь отдаёт index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Служебный путь для балансировщика и мониторинга (не требует бэкенда)
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }
    }
}
