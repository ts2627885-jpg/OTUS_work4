# Проверки качества и сборка при каждом пуше и каждом pull request.
# Интеграционные тесты (с базой данных) здесь не запускаются: им нужна база.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Новый запуск для той же ветки отменяет предыдущий, чтобы не тратить минуты впустую
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — форматирование, линтинг, типы, тесты, сборка
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Установка зависимостей
        run: npm ci
      - name: Проверка форматирования (Prettier)
        run: npm run format:check
      - name: Линтинг (ESLint)
        run: npm run lint
      - name: Проверка типов (TypeScript)
        run: npm run type-check
      - name: Модульные тесты
        run: npm run test:unit
      - name: Сборка
        run: npm run build

  frontend:
    name: Frontend — форматирование, линтинг, тесты, сборка
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_URL: /api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Установка зависимостей
        run: npm ci
      - name: Проверка форматирования (Prettier)
        run: npm run format:check
      - name: Линтинг (ESLint)
        run: npm run lint
      - name: Тесты (Vitest, однократный запуск)
        run: npx vitest run
      - name: Сборка
        run: npm run build

  docker:
    name: Docker — сборка образа бэкенда
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - name: Сборка образа (без публикации)
        run: docker build -f backend/Dockerfile -t azs-pult-backend:ci .
