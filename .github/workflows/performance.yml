name: Performance Testing & Monitoring

on:
  schedule:
    # Daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/performance/**'

env:
  NODE_VERSION: '18.17.0'

jobs:
  lighthouse-audit:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          VITE_APP_API_URL: 'http://localhost:3000/api'

      - name: Start development server
        run: npm run dev &
        env:
          NODE_ENV: production

      - name: Wait for server
        run: npx wait-on http://localhost:5173 --timeout 30000

      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v9
        with:
          runs: 3
          configPath: './lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v3
        with:
          name: lighthouse-reports
          path: .lighthouseci/

  bundle-analysis:
    name: Bundle Size Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Analyze bundle
        run: |
          npm run build:analyze > bundle-report.txt 2>&1 || true

      - name: Check bundle size
        run: |
          BUNDLE_SIZE=$(du -sh dist | awk '{print $1}')
          echo "Bundle Size: $BUNDLE_SIZE"

          # Get previous size from cache
          PREV_SIZE=$(cat .bundle-size-cache 2>/dev/null || echo "0")
          echo "Previous Size: $PREV_SIZE"

          # Store current size
          du -sh dist | awk '{print $1}' > .bundle-size-cache

      - name: Upload bundle analysis
        uses: actions/upload-artifact@v3
        with:
          name: bundle-analysis
          path: |
            bundle-report.txt
            .bundle-size-cache

  load-test-k6:
    name: Load Testing with k6
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: azs_load_test
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          VITE_APP_API_URL: 'http://localhost:3000/api'

      - name: Start backend server
        run: npm run dev:server &
        env:
          REDIS_URL: redis://localhost:6379
          DATABASE_URL: postgresql://postgres:testpass@localhost:5432/azs_load_test
          NODE_ENV: production

      - name: Wait for backend
        run: npx wait-on http://localhost:3000 --timeout 30000

      - name: Install k6
        run: |
          sudo apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3232A
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Run k6 load tests
        run: |
          k6 run tests/load/dashboard.js \
            --vus 50 \
            --duration 30s \
            --out json=load-test-results.json \
            --out csv=load-test-results.csv
        env:
          API_URL: 'http://localhost:3000/api'

      - name: Analyze load test results
        run: |
          # Parse k6 results and check thresholds
          node tests/load/analyze-results.js load-test-results.json

      - name: Upload load test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: load-test-results
          path: |
            load-test-results.json
            load-test-results.csv

  memory-profiling:
    name: Memory Profiling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Run memory profiling
        run: |
          node --expose-gc --max-old-space-size=4096 \
            ./node_modules/.bin/jest \
            --detectOpenHandles \
            --forceExit \
            --coverage \
            tests/performance/memory.spec.ts

      - name: Check for memory leaks
        run: |
          npm run test:memory-leak

      - name: Upload memory profile
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: memory-profile
          path: coverage/

  report-metrics:
    name: Report Performance Metrics
    runs-on: ubuntu-latest
    needs: [ lighthouse-audit, bundle-analysis, load-test-k6, memory-profiling ]
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3

      - name: Compile performance report
        run: |
          cat > performance-report.md << 'EOF'
          # Performance Report

          Generated: $(date)

          ## Lighthouse Audit
          - See lighthouse-reports/ for detailed results

          ## Bundle Analysis
          - See bundle-analysis/ for detailed results

          ## Load Testing
          - See load-test-results/ for detailed results

          ## Memory Profiling
          - See memory-profile/ for detailed results
          EOF

      - name: Upload performance report
        uses: actions/upload-artifact@v3
        with:
          name: performance-report
          path: performance-report.md

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('performance-report.md', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });

      - name: Archive reports
        run: |
          tar -czf performance-reports-$(date +%Y%m%d).tar.gz \
            lighthouse-reports/ \
            bundle-analysis/ \
            load-test-results/ \
            memory-profile/ \
            performance-report.md

      - name: Upload archive
        uses: actions/upload-artifact@v3
        with:
          name: performance-archive
          path: performance-reports-*.tar.gz
          retention-days: 90
