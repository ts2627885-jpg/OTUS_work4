# Автоматический деплой: после успешного CI на ветках main и master.
# Всё приложение (фронт и API) — Vercel. Хук хранится в секрете репозитория
# (Settings → Secrets and variables → Actions). Хук без секрета пропускается.
#   VERCEL_DEPLOY_HOOK_URL   — Vercel: проект → Settings → Git → Deploy Hooks
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    name: Деплой на хостинг
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Фронтенд (Vercel)
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "Секрет VERCEL_DEPLOY_HOOK_URL не задан: деплой фронтенда пропущен."
            exit 0
          fi
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
          echo "Деплой фронтенда запущен."
