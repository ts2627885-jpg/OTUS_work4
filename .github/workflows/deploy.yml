# Автоматический деплой: после успешного CI на ветках main и master.
# Бэкенд — Render, фронтенд — Netlify. Каждый хук хранится в секрете репозитория
# (Settings → Secrets and variables → Actions). Хук без секрета пропускается.
#   RENDER_DEPLOY_HOOK_URL   — Render: сервис azs-pult-backend → Settings → Deploy Hook
#   NETLIFY_BUILD_HOOK_URL   — Netlify: сайт → Site configuration → Build hooks
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    name: Деплой на хостинг
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Бэкенд (Render)
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Секрет RENDER_DEPLOY_HOOK_URL не задан: деплой бэкенда пропущен."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Деплой бэкенда запущен."

      - name: Фронтенд (Netlify)
        env:
          NETLIFY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
        run: |
          if [ -z "$NETLIFY_BUILD_HOOK_URL" ]; then
            echo "Секрет NETLIFY_BUILD_HOOK_URL не задан: деплой фронтенда пропущен."
            exit 0
          fi
          curl -fsS -X POST "$NETLIFY_BUILD_HOOK_URL"
          echo "Деплой фронтенда запущен."
