# Netlify: фронтенд (Vue 3 + Vite). Выкладывается по build hook из deploy.yml
# (секрет NETLIFY_BUILD_HOOK_URL) после успешного CI на main.
[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Запросы к API уходят на бэкенд в Render: фронт использует относительный адрес /api (frontend/.env),
# поэтому браузер видит один домен и CORS не нужен.
# Замените адрес, если сервис Render получил другое имя (панель Render → сервис → URL).
[[redirects]]
  from = "/api/*"
  to = "https://azs-pult-backend.onrender.com/api/:splat"
  status = 200
  force = true

# Одностраничное приложение: все остальные пути отдаём index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
